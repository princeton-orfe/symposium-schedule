<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grader Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-brand-80: #C1560E;
    --color-brand-70: #e77500;
    --color-brand-20: #FEECDE;
    --color-brand-10: #FFF7F2;
    --color-neutral-5: #f7f7f7;
    --color-neutral-10: #eeeeee;
    --color-neutral-20: #D9D9D9;
    --color-neutral-60: #717171;
    --color-neutral-85: #333;
    --color-neutral-100: #121212;
    --font-title: 'Montserrat', sans-serif;
    --font-body: 'Roboto', sans-serif;
  }

  @page {
    size: letter portrait;
    margin: 0.6in 0.75in;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    color: var(--color-neutral-85);
    background: #fff;
    max-width: 7.5in;
    margin: 0 auto;
    padding: 0;
  }

  /* Accent bar */
  .accent-bar {
    height: 4px;
    background: var(--color-brand-70);
  }

  /* Sheet page — one per presenter */
  .sheet-page {
    page-break-before: always;
  }
  .sheet-page:first-of-type {
    page-break-before: auto;
  }

  .page-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--color-neutral-10);
  }
  .page-header h1 {
    font-family: var(--font-title);
    font-size: 22pt;
    font-weight: 700;
    color: var(--color-neutral-100);
    margin-bottom: 2pt;
  }
  .page-header h2 {
    font-family: var(--font-title);
    font-size: 13pt;
    font-weight: 600;
    color: var(--color-brand-80);
  }

  .content {
    padding: 20px 24px;
  }

  .presenter-block {
    background: var(--color-brand-10);
    border-left: 4px solid var(--color-brand-70);
    border-radius: 0 6px 6px 0;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .presenter-name {
    font-family: var(--font-title);
    font-size: 18pt;
    font-weight: 700;
    color: var(--color-neutral-100);
    margin-bottom: 8pt;
  }
  .presenter-info {
    font-family: var(--font-body);
    font-size: 11pt;
    color: var(--color-neutral-85);
  }

  .field-section { margin-bottom: 20px; }
  .field-label {
    font-family: var(--font-title);
    font-size: 11pt;
    font-weight: 600;
    color: var(--color-neutral-85);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8pt;
  }
  .name-field {
    border-bottom: 1.5pt solid var(--color-neutral-20);
    height: 32pt;
    width: 100%;
  }

  .grade-boxes {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 12px;
  }
  .grade-box {
    width: 1.6in;
    height: 0.75in;
    border: 2.5pt solid var(--color-neutral-85);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-title);
    font-size: 28pt;
    font-weight: 700;
    color: var(--color-neutral-100);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--color-neutral-10);
    margin: 20px 0;
  }

  .comment-lines { margin-top: 10px; }
  .comment-line {
    height: 28pt;
    border-bottom: 0.5pt solid var(--color-neutral-20);
    width: 100%;
  }

  /* Selection UI */
  .picker {
    padding: 32px 24px;
  }
  .picker h1 {
    font-family: var(--font-title);
    font-size: 22pt;
    font-weight: 700;
    color: var(--color-neutral-100);
    margin-bottom: 4pt;
  }
  .picker h2 {
    font-family: var(--font-title);
    font-size: 13pt;
    font-weight: 600;
    color: var(--color-brand-80);
    margin-bottom: 24px;
  }
  .picker-desc {
    font-size: 11pt;
    color: var(--color-neutral-60);
    margin-bottom: 20px;
  }
  .picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .picker-btn {
    font-family: var(--font-title);
    font-size: 11pt;
    font-weight: 600;
    padding: 14px 16px;
    cursor: pointer;
    background: var(--color-brand-10);
    color: var(--color-neutral-100);
    border: 1.5px solid var(--color-brand-70);
    border-radius: 6px;
    text-align: left;
    transition: background 0.15s;
  }
  .picker-btn:hover { background: var(--color-brand-20); }
  .picker-btn .room-num {
    display: block;
    font-size: 14pt;
    margin-bottom: 2px;
  }
  .picker-btn .room-count {
    font-weight: 400;
    font-size: 9pt;
    color: var(--color-neutral-60);
  }
  .picker-all {
    font-family: var(--font-title);
    font-size: 12pt;
    font-weight: 600;
    padding: 14px 32px;
    cursor: pointer;
    background: var(--color-brand-70);
    color: #fff;
    border: none;
    border-radius: 6px;
  }
  .picker-all:hover { background: var(--color-brand-80); }
  .picker-total {
    display: inline-block;
    margin-left: 12px;
    font-size: 10pt;
    color: var(--color-neutral-60);
  }

  /* Toolbar shown when sheets are rendered */
  .toolbar {
    background: var(--color-neutral-5);
    border-bottom: 1px solid var(--color-neutral-10);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .toolbar button {
    font-family: var(--font-title);
    font-size: 11pt;
    font-weight: 600;
    padding: 8px 24px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }
  .toolbar .print-btn { background: var(--color-brand-70); color: #fff; }
  .toolbar .print-btn:hover { background: var(--color-brand-80); }
  .toolbar .back-btn { background: var(--color-neutral-10); color: var(--color-neutral-85); }
  .toolbar .back-btn:hover { background: var(--color-neutral-20); }
  .toolbar p {
    font-size: 10pt;
    color: var(--color-neutral-60);
  }

  .loading {
    text-align: center;
    padding: 3rem;
    font-size: 13pt;
    color: var(--color-neutral-60);
  }
  .error-msg {
    text-align: center;
    padding: 3rem;
    color: #cf222e;
    font-size: 13pt;
  }

  @media print {
    body { padding: 0; }
    .toolbar, .picker { display: none !important; }
    .accent-bar { height: 3px; }
    .page-header { padding: 16px 0 12px; }
    .content { padding: 16px 0; }
  }
</style>
</head>
<body>

<div class="accent-bar"></div>

<!-- Selection UI -->
<div id="picker" class="picker" style="display:none">
  <h1>ORFE Senior Thesis Symposium</h1>
  <h2>Presentation Grader Sheets</h2>
  <p class="picker-desc">Select a room to print grader sheets for that room, or print all at once.</p>
  <div id="room-grid" class="picker-grid"></div>
  <button class="picker-all" onclick="renderAll()">Print All Rooms</button>
  <span id="total-count" class="picker-total"></span>
</div>

<!-- Toolbar shown when viewing sheets -->
<div id="toolbar" class="toolbar" style="display:none">
  <button class="print-btn" onclick="window.print()">Print</button>
  <button class="back-btn" onclick="location.href=location.pathname">Back</button>
  <p id="toolbar-info"></p>
</div>

<!-- Sheets container -->
<div id="sheets"></div>

<!-- Status messages -->
<div id="loading" class="loading">Loading schedule data&hellip;</div>
<div id="error-msg" class="error-msg" style="display:none"></div>

<script>
(function() {
  var BREAK_KEYWORDS = ['break', 'photo', 'lunch'];
  var scheduleData = null;

  function isBreak(name) {
    var lower = name.toLowerCase();
    return BREAK_KEYWORDS.some(function(kw) { return lower.indexOf(kw) !== -1; });
  }

  function buildSheetHTML(presenter, room, time) {
    var commentLines = '';
    for (var i = 0; i < 11; i++) {
      commentLines += '<div class="comment-line"></div>';
    }

    return '<div class="sheet-page">' +
      '<div class="page-header">' +
        '<h1>ORFE Senior Thesis Symposium</h1>' +
        '<h2>Presentation Grader Sheet</h2>' +
      '</div>' +
      '<div class="content">' +
        '<div class="presenter-block">' +
          '<div class="presenter-name">' + escapeHTML(presenter) + '</div>' +
          '<div class="presenter-info">' + escapeHTML(room + ' \u2013 Sherrerd Hall') +
            '  \u00B7  ' + escapeHTML(time) + '</div>' +
        '</div>' +
        '<div class="field-section">' +
          '<div class="field-label">Your Name</div>' +
          '<div class="name-field"></div>' +
        '</div>' +
        '<hr class="divider">' +
        '<div class="field-section">' +
          '<div class="field-label">Presentation Quality (circle one)</div>' +
          '<div class="grade-boxes">' +
            '<div class="grade-box">A&ndash;</div>' +
            '<div class="grade-box">A</div>' +
            '<div class="grade-box">A+</div>' +
          '</div>' +
        '</div>' +
        '<hr class="divider">' +
        '<div class="field-section">' +
          '<div class="field-label">Comments</div>' +
          '<div class="comment-lines">' + commentLines + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function escapeHTML(str) {
    var el = document.createElement('span');
    el.textContent = str;
    return el.innerHTML;
  }

  function countPresenters(rooms, roomKeys) {
    var count = 0;
    roomKeys.forEach(function(room) {
      rooms[room].schedule.forEach(function(entry) {
        if (!isBreak(entry[1])) count++;
      });
    });
    return count;
  }

  function renderSheets(roomKeys) {
    var html = '';
    var count = 0;
    roomKeys.forEach(function(room) {
      scheduleData[room].schedule.forEach(function(entry) {
        if (isBreak(entry[1])) return;
        html += buildSheetHTML(entry[1], room, entry[0]);
        count++;
      });
    });

    document.getElementById('picker').style.display = 'none';
    document.getElementById('sheets').innerHTML = html;
    document.getElementById('toolbar').style.display = 'flex';

    var label = roomKeys.length === 1
      ? 'Room ' + roomKeys[0] + ' \u2014 ' + count + ' sheets'
      : 'All rooms \u2014 ' + count + ' sheets';
    document.getElementById('toolbar-info').textContent = label;
    document.title = 'Grader Sheets \u2013 ' + (roomKeys.length === 1 ? 'Room ' + roomKeys[0] : 'All Rooms');
  }

  window.renderRoom = function(room) {
    renderSheets([room]);
  };

  window.renderAll = function() {
    renderSheets(Object.keys(scheduleData).sort());
  };

  // Check URL params
  var params = new URLSearchParams(window.location.search);
  var roomParam = params.get('room');
  var allParam = params.has('all');

  // Fetch schedule JSON
  fetch('symposium_schedule.json')
    .then(function(res) {
      if (!res.ok) throw new Error('Could not load schedule data (HTTP ' + res.status + ')');
      return res.json();
    })
    .then(function(data) {
      scheduleData = data;
      document.getElementById('loading').style.display = 'none';

      var rooms = Object.keys(data).sort();
      if (rooms.length === 0) {
        document.getElementById('error-msg').textContent = 'No schedule data available.';
        document.getElementById('error-msg').style.display = 'block';
        return;
      }

      // Direct render if URL param provided
      if (allParam) {
        renderAll();
        return;
      }
      if (roomParam && data[roomParam]) {
        renderSheets([roomParam]);
        return;
      }

      // Show picker
      var grid = document.getElementById('room-grid');
      var totalPresenters = 0;
      rooms.forEach(function(room) {
        var n = countPresenters(data, [room]);
        totalPresenters += n;
        var btn = document.createElement('button');
        btn.className = 'picker-btn';
        btn.onclick = function() { renderRoom(room); };
        btn.innerHTML = '<span class="room-num">Room ' + escapeHTML(room) + '</span>' +
          '<span class="room-count">' + n + ' presenter' + (n !== 1 ? 's' : '') + '</span>';
        grid.appendChild(btn);
      });
      document.getElementById('total-count').textContent = totalPresenters + ' sheets total';
      document.getElementById('picker').style.display = 'block';
    })
    .catch(function(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-msg').textContent = err.message;
      document.getElementById('error-msg').style.display = 'block';
    });
})();
</script>

</body>
</html>
