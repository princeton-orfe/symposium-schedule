<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation Grader Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-brand-100: #411C02;
    --color-brand-90: #6D2E03;
    --color-brand-80: #C1560E;
    --color-brand-70: #e77500;
    --color-brand-60: #F7964A;
    --color-brand-20: #FEECDE;
    --color-brand-10: #FFF7F2;
    --color-neutral-5: #f7f7f7;
    --color-neutral-10: #eeeeee;
    --color-neutral-20: #D9D9D9;
    --color-neutral-60: #717171;
    --color-neutral-85: #333;
    --color-neutral-100: #121212;
    --font-title: 'Montserrat', sans-serif;
    --font-body: 'Roboto', sans-serif;
  }

  @page {
    size: letter portrait;
    margin: 0.6in 0.75in;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    color: var(--color-neutral-85);
    background: #fff;
    max-width: 7.5in;
    margin: 0 auto;
    padding: 0;
  }

  /* Orange accent bar */
  .accent-bar {
    height: 4px;
    background: var(--color-brand-70);
  }

  /* Page header */
  .page-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--color-neutral-10);
  }
  .page-header h1 {
    font-family: var(--font-title);
    font-size: 22pt;
    font-weight: 700;
    color: var(--color-neutral-100);
    margin-bottom: 2pt;
  }
  .page-header h2 {
    font-family: var(--font-title);
    font-size: 13pt;
    font-weight: 600;
    color: var(--color-brand-80);
  }

  /* Content area */
  .content {
    padding: 20px 24px;
  }

  .presenter-block {
    background: var(--color-brand-10);
    border-left: 4px solid var(--color-brand-70);
    border-radius: 0 6px 6px 0;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .presenter-name {
    font-family: var(--font-title);
    font-size: 18pt;
    font-weight: 700;
    color: var(--color-neutral-100);
    margin-bottom: 8pt;
  }
  .talk-title {
    font-family: var(--font-body);
    font-size: 11pt;
    font-style: italic;
    color: var(--color-neutral-60);
    margin-bottom: 8pt;
    line-height: 1.4;
  }
  .presenter-info {
    font-family: var(--font-body);
    font-size: 11pt;
    color: var(--color-neutral-85);
  }

  /* Form fields */
  .field-section {
    margin-bottom: 20px;
  }
  .field-label {
    font-family: var(--font-title);
    font-size: 11pt;
    font-weight: 600;
    color: var(--color-neutral-85);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8pt;
  }
  .name-field {
    border-bottom: 1.5pt solid var(--color-neutral-20);
    height: 32pt;
    width: 100%;
  }

  /* Grade section */
  .grade-boxes {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 12px;
  }
  .grade-box {
    width: 1.6in;
    height: 0.75in;
    border: 2.5pt solid var(--color-neutral-85);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-title);
    font-size: 28pt;
    font-weight: 700;
    color: var(--color-neutral-100);
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--color-neutral-10);
    margin: 20px 0;
  }

  /* Comments */
  .comment-lines { margin-top: 10px; }
  .comment-line {
    height: 28pt;
    border-bottom: 0.5pt solid var(--color-neutral-20);
    width: 100%;
  }

  /* Print button bar */
  .no-print {
    background: var(--color-neutral-5);
    border-bottom: 1px solid var(--color-neutral-10);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .no-print button {
    font-family: var(--font-title);
    font-size: 11pt;
    font-weight: 600;
    padding: 8px 24px;
    cursor: pointer;
    background: var(--color-brand-70);
    color: #fff;
    border: none;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }
  .no-print button:hover { background: var(--color-brand-80); }
  .no-print p {
    font-size: 10pt;
    color: var(--color-neutral-60);
  }

  .error {
    text-align: center;
    padding: 3rem 2rem;
    color: #cf222e;
    font-size: 13pt;
  }
  .error code {
    background: var(--color-neutral-5);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11pt;
  }

  @media print {
    body { padding: 0; }
    .no-print { display: none !important; }
    .accent-bar { height: 3px; }
    .page-header { padding: 16px 0 12px; }
    .content { padding: 16px 0; }
  }
</style>
</head>
<body>

<div id="sheet">
  <div class="accent-bar"></div>

  <div class="no-print">
    <button onclick="window.print()">Print Grader Sheet</button>
    <p>Use your browser's "Save as PDF" option for a PDF copy.</p>
  </div>

  <div class="page-header">
    <h1>ORFE Senior Thesis Symposium</h1>
    <h2>Presentation Grader Sheet</h2>
  </div>

  <div class="content">
    <div class="presenter-block">
      <div class="presenter-name" id="presenter"></div>
      <div class="talk-title" id="talk-title"></div>
      <div class="presenter-info" id="info"></div>
    </div>

    <div class="field-section">
      <div class="field-label">Your Name</div>
      <div class="name-field"></div>
    </div>

    <hr class="divider">

    <div class="field-section">
      <div class="field-label">Presentation Quality (circle one)</div>
      <div class="grade-boxes">
        <div class="grade-box">A&ndash;</div>
        <div class="grade-box">A</div>
        <div class="grade-box">A+</div>
      </div>
    </div>

    <hr class="divider">

    <div class="field-section">
      <div class="field-label">Comments</div>
      <div class="comment-lines" id="comment-lines"></div>
    </div>
  </div>
</div>

<div class="error" id="error" style="display:none">
  <p>Missing required parameters. Use a link from the symposium schedule page.</p>
  <p style="margin-top:0.5em; font-size:10pt; color:#717171;">
    Required: <code>name</code>, <code>room</code>, <code>start</code><br>
    Optional: <code>title</code>, <code>end</code>
  </p>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var name = params.get('name');
  var room = params.get('room');
  var start = params.get('start');
  var end = params.get('end');
  var title = params.get('title');

  function formatTime(str) {
    if (!str) return '';
    if (str.indexOf('T') !== -1) {
      var iso = str.match(/[Z+\-]/) ? str : str + 'Z';
      var d = new Date(iso);
      if (!isNaN(d)) {
        return d.toLocaleTimeString('en-US', {
          hour: 'numeric', minute: '2-digit',
          timeZone: 'America/New_York'
        });
      }
    }
    return str;
  }

  if (!name || !room || !start) {
    document.getElementById('sheet').style.display = 'none';
    document.querySelector('.no-print').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    return;
  }

  document.title = 'Grader Sheet \u2013 ' + name;
  document.getElementById('presenter').textContent = name;

  if (title) {
    document.getElementById('talk-title').textContent = title;
  }

  var startFmt = formatTime(start);
  var endFmt = formatTime(end);
  var timeText = startFmt;
  if (endFmt) timeText += ' \u2013 ' + endFmt;
  document.getElementById('info').textContent = room + '  \u00B7  ' + timeText;

  var container = document.getElementById('comment-lines');
  for (var i = 0; i < 11; i++) {
    var div = document.createElement('div');
    div.className = 'comment-line';
    container.appendChild(div);
  }
})();
</script>

</body>
</html>
