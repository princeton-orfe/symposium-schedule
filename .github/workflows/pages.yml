name: Deploy Public Displays to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  # Also deploy whenever the generate workflow completes (new JSON data)
  workflow_run:
    workflows: [ "Generate Symposium Schedule" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only deploy on successful generate runs (or push/dispatch triggers)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download latest schedule JSON from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Fetch the JSON from the latest release
        if gh release download latest --pattern 'symposium_schedule.json' --dir pages/ 2>/dev/null; then
          echo "Downloaded symposium_schedule.json from release"
        else
          echo "::warning::No release JSON found — pages will deploy without schedule data"
          echo '{}' > pages/symposium_schedule.json
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: pages

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
